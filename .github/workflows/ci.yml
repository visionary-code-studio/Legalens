name: Legalens CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov safety bandit

    - name: Run Backend Pytest Suite with Coverage
      run: |
        pytest -v --tb=short --cov=AI --cov=Backend --cov-report=term-missing --cov-fail-under=70
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Security Audit — Dependency Vulnerability Scan
      run: |
        pip install pip-audit
        pip-audit --strict || true
      continue-on-error: true

    - name: Security Audit — Static Analysis (Bandit)
      run: |
        bandit -r AI/ Backend/ -ll --skip B101 || true
      continue-on-error: true

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: Frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd Frontend
        npm ci

    - name: Run Frontend Lint & Typecheck
      run: |
        cd Frontend
        npm test

    - name: Build Next.js Production Bundle
      run: |
        cd Frontend
        npm run build
      env:
        NEXT_PUBLIC_API_URL: https://legalens-api.onrender.com
